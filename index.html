<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Epunda+Slab:ital,wght@0,300..900;1,300..900&family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&family=Miniver&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="heading">
        <div class="title">
            <img src="images/icons8-search-50.png" class="search" alt="">
            <img src="images/logo.svg" style="height: 40px;" alt="">
            <img src="images/icons8-person-48.png" class="person" alt="">
        </div>
    </header>

    <nav class="nav">
        <div class="nav-heading">
            <div class="navbar">
                <img src="images/icons8-facebook-30.png" alt="" class="app">
                <img src="images/icons8-twitter-48.png" alt="" class="app">
                <img src="images/icons8-insta-30.png" alt="" class="app">
            </div>
            <div class="list">
                <ul>
                    <li>Home</li>
                    <li>Recipes</li>
                    <li>About</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div class="button">
                <button class="submit-recipe-btn">Submit Recipe</button>
            </div>
        </div>
    </nav>

    <main class="hero">

        <div class="main">
            <div class="text-container">

                <span class="recipe-day">RECIPE OF THE DAY</span>
                <h1>Tasty Fluffy Pancakes</h1>

                <div class="made-by">
                    <div class="author-container">
                        <img src="images/author.png" class="author" style="height: 40px;" alt="">
                        <p>By Rachel Brandley</p>
                    </div>

                    <div class="timer-container">
                        <img src="images/timer.svg" class="timer" style="height: 40px;" alt="">
                        <p>1 hour and 30 mins</p>
                    </div>
                </div>

                <p class="description">The Best Fluffy Pancakes recipe you will fall in love with. Full of tips and
                    tricks to help you make the best pancakes... ever!</p>

                <div class="buttons">
                    <button class="cook-now">Cook Now</button>
                    <button class="explore-recipes">Explore Recipes</button>
                </div>

            </div>

            <div class="image-container">
                <div class="pancake-img">
                    <img src="images/pancake.jpeg" class="pancake" alt="">
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
