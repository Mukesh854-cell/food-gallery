<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="heading">
        <div class="title">
            <img src="images/icons8-search-50.png" class="search" alt="">
            <img src="images/logo.svg" style="height: 40px;" alt="">
            <img src="images/icons8-person-48.png" class="person" alt="">
        </div>
    </header>

    <nav class="nav">
        <div class="nav-heading">
            <div class="navbar">
                <img src="images/icons8-facebook-30.png" alt="" class="app">
                <img src="images/icons8-twitter-48.png" alt="" class="app">
                <img src="images/icons8-insta-30.png" alt="" class="app">
            </div>
            <div class="list">
                <ul>
                    <li>Home</li>
                    <li>Recipes</li>
                    <li>About</li>
                    <li>Contact</li>
                </ul>
            </div>
            <div class="button">
                <button class="submit-recipe-btn">Submit Recipe</button>
            </div>
        </div>
    </nav>

    <script src="script.js"></script>
</body>

</html>
